[tool.poetry]
name = "onepilot"
version = "1.0.0"
description = "Agent IA conversationnel universel pour ERP"
authors = ["Ghassen Riahi <votre.email@example.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "onepilot", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-multipart = "^0.0.6"
websockets = "^12.0"
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
redis = "^5.0.1"
requests = "^2.31.0"
httpx = "^0.26.0"
aiofiles = "^23.2.1"
cryptography = "^42.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-dateutil = "^2.8.2"
pyyaml = "^6.0.1"
pandas = "^2.1.4"
numpy = "^1.26.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
httpx = "^0.26.0"
black = "^23.12.1"
flake8 = "^7.0.0"
isort = "^5.13.2"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--verbose"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"